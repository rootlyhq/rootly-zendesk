name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ZCLI: npx --yes @zendesk/zcli@2.0.0
      ZENDESK_SUBDOMAIN: ${{ vars.ZENDESK_SUBDOMAIN }}
      ZENDESK_APP_ID: ${{ vars.ZENDESK_APP_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - name: Check tag matches manifest version
        run: |
          manifest_version=$(node -p "require('./dist/manifest.json').version")
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest_version}"
            exit 1
          fi
      - name: Validate with Zendesk
        env:
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
        run: $ZCLI apps:validate dist
      - name: Package app
        run: cd dist && zip -r "../rootly-zendesk-${GITHUB_REF_NAME}.zip" . -x 'tmp/*'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "rootly-zendesk-${GITHUB_REF_NAME}.zip" --repo "${GITHUB_REPOSITORY}" --generate-notes
      - name: Upload to Zendesk
        env:
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
        run: $ZCLI apps:update dist
